  # ------------------------------------------- the relief valves
  curtailment_headroom_gw:
    value: [76, 126]
    unit: GW
    provenance: ESTIMATED
    source: "Norris et al., Rethinking Load Growth, NI R 25-01, Duke Nicholas Institute: 76 GW at 0.25% of annual ENERGY curtailed, 98 GW at 0.5%, 126 GW at 1.0%"
    url: https://nicholasinstitute.duke.edu/sites/default/files/publications/rethinking-load-growth.pdf
    as_of: 2025-02-11
    note: >
      Limits are percentages of ENERGY, not hours: 0.5% corresponds to 177
      curtailment hours, not 44, because most events are partial. Authors'
      own caveat is load-bearing: 'the results cannot be taken as an accurate
      estimate of the load that can be added to the system'; no network
      constraints, no LOLE modelling. PJM 17.8 GW, MISO 14.8, ERCOT 10.0 at
      the 0.5% limit. Demonstrated at scale: ~0.1 MW (Emerald AI, 256 GPUs).
      No US source publishes GW of data-center load actually operating under
      a curtailable tariff.

