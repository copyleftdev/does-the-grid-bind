# Parameters for the energization-gap model.
#
# Rules enforced by src/chipgrid/load.py:
#   - every non-ASSUMED parameter carries a source
#   - every MEASURED / FILED / OFFICIAL parameter carries an as-of date
#   - values are exact literals (strings or ints), never floats
#   - a two-element value is a closed interval [lo, hi]
#
# provenance: MEASURED | FILED | OFFICIAL | ESTIMATED | VENDOR | ADVOCACY | DERIVED | ASSUMED

parameters:

  # ----------------------------------------------------------------- demand
  us_dc_twh_2024:
    value: 192
    unit: TWh/yr
    provenance: MEASURED
    source: "LBNL-2001758, US Data Center Energy Usage Report: 2025 Update"
    url: https://doi.org/10.71468/P1RP4F
    as_of: 2026-06
    note: >
      Excludes cryptocurrency mining. Came in at the LOW end of the 2024
      report's range, and LBNL revised prior years down: fewer accelerators
      shipped in 2023-24 than IDC had forecast. The near-term overshoot in the
      2024-vintage forecasts was real and has been corrected.

  us_dc_twh_2030_reference:
    value: 649
    unit: TWh/yr
    provenance: ESTIMATED
    source: "LBNL-2001758 Reference Case"
    url: https://doi.org/10.71468/P1RP4F
    as_of: 2026-06

  us_dc_twh_2030_range:
    value: [521, 843]
    unit: TWh/yr
    provenance: ESTIMATED
    source: "LBNL-2001758 Compounded Uncertainty low/high"
    url: https://doi.org/10.71468/P1RP4F
    as_of: 2026-06

  us_dc_twh_2030_all_forecasters:
    value: [380, 843]
    unit: TWh/yr
    provenance: ESTIMATED
    source: "EPRI 2026 low bound to LBNL 2026 high bound"
    url: https://restservice.epri.com/publicattachment/97025
    as_of: 2026-06
    note: >
      2.2x spread across credible forecasters. EPRI INCLUDES crypto mining,
      LBNL excludes it (~70 TWh in 2023), so the two are not the same
      quantity and the true spread is wider than it looks.

  # ------------------------------------------------- the conversion to power
  interconnection_capacity_factor_lbnl:
    value: "0.50"
    unit: dimensionless
    provenance: ASSUMED
    source: "LBNL-2001758: 'not well documented but is estimated to be around 50%'"
    url: https://doi.org/10.71468/P1RP4F
    note: >
      LBNL's own words. This single undocumented number converts every TWh
      figure into the GW figure that the grid debate is conducted in.

  interconnection_capacity_factor_measured_hyperscale:
    value: "0.75"
    unit: dimensionless
    provenance: MEASURED
    source: "EPRI 2026, Powering Intelligence; quoted in IEA Key Questions on Energy and AI p.56"
    url: https://iea.blob.core.windows.net/assets/3179f7f8-01f6-4dd6-bffa-c9f7b73f1dc9/KeyQuestionsonEnergyandAI.pdf
    as_of: 2026-04
    note: "Measured across examined hyperscale facilities. Colocation measured at 0.57."

  interconnection_capacity_factor_measured_colo:
    value: "0.57"
    unit: dimensionless
    provenance: MEASURED
    source: "EPRI 2026, via IEA Key Questions on Energy and AI p.56"
    url: https://iea.blob.core.windows.net/assets/3179f7f8-01f6-4dd6-bffa-c9f7b73f1dc9/KeyQuestionsonEnergyandAI.pdf
    as_of: 2026-04

  us_interconnection_gw_added_per_yr_2024_2030:
    value: "17.4"
    unit: GW/yr
    provenance: ESTIMATED
    source: "LBNL-2001758 Reference Case, 148 GW by 2030, CAGR 22%"
    url: https://doi.org/10.71468/P1RP4F
    as_of: 2026-06
    note: "Carries LBNL's 50% capacity-factor assumption; at EPRI's measured 75% it is ~11.6 GW/yr."

  # ------------------------------------------------------------- hardware
  accelerator_units_shipped_2024:
    value: 7000000
    unit: units/yr
    provenance: ESTIMATED
    source: "LBNL-2001758 (73% GPU / 27% ASIC)"
    url: https://doi.org/10.71468/P1RP4F
    as_of: 2026-06

  accelerator_units_shipped_2030:
