\* REGIME B: total energized capacity is enough for the shipment programme,
\* but only if the installed base gives up its envelope. EnergizeRate = 0 is
\* the realistic near-term case implied by I3: nothing new lands inside the
\* lead time.  S=4, E=4, B=4  =>  E-B=0 < S <= E.
\* EXPECTED: absorption IS reachable (Probe_NeverAbsorbed violated),
\* but never cleanly (NoFreeAbsorption holds).
CONSTANTS
    MaxTime = 4
    ShipRate = 1
    EnergizeRate = 0
    InitEnergized = 4
    InitOld = 4
    Life = 6
    Cap = 12
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    I1_Conservation
    I2_Envelope
    I4_BookConservation
    Probe_NeverAbsorbed
