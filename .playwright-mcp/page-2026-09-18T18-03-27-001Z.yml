                - text: Updated Fri, Nov 14 2025
                - generic [ref=e113]: •
                - text: 11:19 AM EST
          - generic [ref=e117]:
            - img "thumbnail" [ref=e118]
            - generic [ref=e119]:
              - link "Kif Leswing" [ref=e120] [cursor=pointer]:
                - /url: https://www.cnbc.com/kif-leswing/
