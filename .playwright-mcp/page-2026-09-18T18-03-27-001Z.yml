          - generic [ref=e123]:
            - generic [ref=e125]:
              - generic [ref=e126]: Key Points
              - list [ref=e130]:
                - listitem [ref=e131]: Depreciation has been the talk of the AI industry of late, as investors try to determine the useful life of key pieces of equipment.
                - listitem [ref=e132]: Google, Oracle and Microsoft have pegged the lifespan of their AI computers at up to six years, but skeptics like short seller Michael Burry say they may not last that long.
                - listitem [ref=e133]: The current AI boom is only three years old, so estimating depreciation remains a challenge.
            - generic [ref=e134]:
              - generic [ref=e135]:
                - generic [ref=e137]:
                  - 'img "WASHINGTON, DC - OCTOBER 28: Nvidia President and CEO Jensen Huang speaks about NVIDIA Omniverse as he delivers the keynote address during the Nvidia GTC (GPU Technology Conference) at the Walter E. Washington Convention Center on October 28, 2025 in Washington, DC. Nvidia is hosting the conference for tech developers and leaders in innovation to discuss the future of AI. (Photo by Anna Moneymaker/Getty Images)" [ref=e141]'
                  - generic [ref=e142]:
                    - generic [ref=e143]: Nvidia President and CEO Jensen Huang speaks about NVIDIA Omniverse as he delivers the keynote address during the Nvidia GTC (GPU Technology Conference) at the Walter E. Washington Convention Center on Oct. 28, 2025 in Washington, DC.
                    - generic [ref=e144]: Anna Moneymaker | Getty Images
                - generic [ref=e145]:
                  - paragraph [ref=e146]: "As a handful of the world’s most valuable companies set out to spend $1 trillion over the next five years on data centers for artificial intelligence, one line item is on the minds of executives and investors: depreciation."
                  - paragraph [ref=e147]:
                    - text: In accounting, depreciation is the act of allocating the cost of a hard asset over the course of its expected useful life. It’s an increasingly important concept in the tech industry, as companies predict how long the hundreds of thousands of
                    - generic [ref=e148]:
                      - link "Nvidia" [ref=e149] [cursor=pointer]:
                        - /url: /quotes/NVDA/
                      - button "Add To Watchlist" [ref=e152] [cursor=pointer]
                    - text: graphics processing units, or GPUs, they’re purchasing will remain useful or retain their value.
                  - paragraph [ref=e154]:
                    - text: Infrastructure giants like
                    - generic [ref=e155]:
                      - link "Google" [ref=e156] [cursor=pointer]:
                        - /url: /quotes/GOOGL/
                      - button "Add To Watchlist" [ref=e159] [cursor=pointer]
                    - text: ","
                    - generic [ref=e161]:
                      - link "Oracle" [ref=e162] [cursor=pointer]:
                        - /url: /quotes/ORCL/
                      - button "Add To Watchlist" [ref=e165] [cursor=pointer]
                    - text: and
                    - generic [ref=e167]:
                      - link "Microsoft" [ref=e168] [cursor=pointer]:
                        - /url: /quotes/MSFT/
                      - button "Add To Watchlist" [ref=e171] [cursor=pointer]
                    - text: have said their servers could be useful for up to six years. But they could also depreciate much sooner. Microsoft said in its latest
                    - link "annual filing" [ref=e173] [cursor=pointer]:
                      - /url: https://microsoft.gcs-web.com/static-files/9640e86d-a99f-4502-934d-1d3c883fa786
                    - text: that its computer equipment lasts two to six years.
                  - paragraph [ref=e174]: That’s a lot to consider for the investors and lenders financing the giant AI buildouts, because the longer equipment remains valuable, the more years a company can stretch out depreciation and the less it hurts profits.
                - generic [ref=e178]:
                  - heading "Read more CNBC news on AI" [level=2] [ref=e179]
                  - list [ref=e181]:
                    - listitem [ref=e182]:
                      - text: •
                      - link "Nvidia shares rise before its big AI conference. Here’s what Wall Street expects" [ref=e183] [cursor=pointer]:
                        - /url: https://www.cnbc.com/2026/03/16/nvidia-shares-are-rising-before-its-big-ai-conference-heres-what-wall-street-expects-to-hear.html
                    - listitem [ref=e184]:
                      - text: •
                      - 'link "Investing Club: A closer look at Nvidia’s $20 billion bet on tech for a new AI chip" [ref=e185] [cursor=pointer]':
                        - /url: https://www.cnbc.com/2026/03/13/a-closer-look-at-nvidias-20-billion-bet-on-tech-for-a-new-ai-chip.html
                    - listitem [ref=e186]:
                      - text: •
                      - link "Nebius jumps 14% after inking $27 billion infrastructure deal with Meta" [ref=e187] [cursor=pointer]:
                        - /url: https://www.cnbc.com/2026/03/16/meta-nebius-ai-infrastructure.html
                    - listitem [ref=e188]:
                      - text: •
                      - link "Elon Musk says xAI must be ‘rebuilt’ amid co-founder exodus, SpaceX IPO" [ref=e189] [cursor=pointer]:
                        - /url: https://www.cnbc.com/2026/03/13/elon-musk-xai-co-founders-spacex-ipo.html
                - generic [ref=e190]:
                  - paragraph [ref=e191]:
                    - text: AI GPUs represent a particular challenge because they’re still relatively new to the market. Nvidia’s first AI-focused processors for data centers came out around 2018. The current AI boom started with the launch of ChatGPT in late 2022. Since then, Nvidia’s annual data center revenue has jumped from $15 billion to
                    - link "$115 billion" [ref=e192] [cursor=pointer]:
                      - /url: https://www.cnbc.com/2025/02/26/nvidia-nvda-earnings-report-q4-2025.html
                    - text: in the fiscal year that ended in January.
                  - paragraph [ref=e193]: There’s no real track record for how long GPUs last when compared with other types of heavy equipment that businesses have been using for decades, said Haim Zaltzman, vice chair of Latham & Watkins’ emerging companies and growth practice.
                  - paragraph [ref=e194]: “Is it three years, is it five, or is it seven?” said Zaltzman, who works on GPU financings, in an interview. “It’s a huge difference in terms of how successful it is for financing purposes.”
                  - paragraph [ref=e195]:
                    - text: Some of Nvidia’s customers say AI chips will retain value for a long time and that customers will continue to pay for access to older processors because they’ll still be useful for other tasks.
                    - generic [ref=e196]:
                      - link "CoreWeave" [ref=e197] [cursor=pointer]:
                        - /url: /quotes/CRWV/
                      - button "Add To Watchlist" [ref=e200] [cursor=pointer]
                    - text: ", which buys GPUs and rents them out to clients, has used six-year depreciation cycles for its infrastructure since 2023."
                  - paragraph [ref=e202]: CoreWeave CEO Michael Intrator told CNBC this week, following quarterly earnings, that his company is being “data driven” about GPU shelf life.
                  - paragraph [ref=e203]: Intrator said that CoreWeave’s Nvidia A100 chips, which were announced in 2020, are all fully booked. He also added that a batch of Nvidia H100 chips from 2022 became available because a contract expired, and they were immediately booked at 95% of their original price.
                  - paragraph [ref=e204]: “All of the data points that I’m getting are telling me that the infrastructure retains value,” Intrator said.
                - generic [ref=e208]:
                  - generic [ref=e209]: CoreWeave CEO, Michael Intrator appears on CNBC on July 17, 2024.
                  - generic [ref=e210]: CNBC
                - generic [ref=e211]:
                  - paragraph [ref=e212]:
                    - text: Still, CoreWeave
                    - link "shares plunged" [ref=e213] [cursor=pointer]:
                      - /url: https://www.cnbc.com/2025/11/11/coreweave-stock-core-scientific-delays.html
                    - text: 16% after its earnings report as delays at a third-party data center developer hit full-year guidance. The stock is down 57% from its high reached in June, part of a broader sell-off reflecting concerns about overspending in AI.
                    - link "Oracle shares" [ref=e214] [cursor=pointer]:
                      - /url: https://www.cnbc.com/2025/11/13/ai-sentiment-is-waning-wall-street-cools-on-oracle-buildout-plans.html
                    - text: have plummeted 34% from their record high in September.
                  - paragraph [ref=e215]:
                    - text: Among the most vocal skeptics of the AI trade is short seller Michael Burry, who recently disclosed bets against Nvidia and
                    - generic [ref=e216]:
                      - link "Palantir" [ref=e217] [cursor=pointer]:
                        - /url: /quotes/PLTR/
                      - button "Add To Watchlist" [ref=e220] [cursor=pointer]
                    - text: .
                  - paragraph [ref=e222]:
                    - text: Burry this week
                    - link "suggested" [ref=e223] [cursor=pointer]:
                      - /url: https://x.com/michaeljburry/status/1987918650104283372
                    - text: that companies including
                    - generic [ref=e224]:
                      - link "Meta" [ref=e225] [cursor=pointer]:
                        - /url: /quotes/META/
                      - button "Add To Watchlist" [ref=e228] [cursor=pointer]
                    - text: ", Oracle, Microsoft, Google and"
                    - generic [ref=e230]:
                      - link "Amazon" [ref=e231] [cursor=pointer]:
                        - /url: /quotes/AMZN/
                      - button "Add To Watchlist" [ref=e234] [cursor=pointer]
                    - text: are overstating the useful life of their AI chips and understating depreciation. He pegs the actual useful life of server equipment at around two to three years, and said companies are inflating their earnings as a result.
                  - paragraph [ref=e236]: Amazon and Microsoft declined to comment. Meta, Google and Oracle did not respond to requests for comment.
                - heading "‘You couldn’t give Hoppers away’" [level=2] [ref=e237]: ‘You couldn’t give Hoppers away’
                - generic [ref=e238]:
                  - paragraph [ref=e239]: There are a number of ways AI chips could depreciate before six years. They could wear out and break, or they could become obsolete as newer GPUs are released. They could still be useful for running certain workloads, but with much worse economics.
                  - paragraph [ref=e240]: Nvidia CEO Jensen Huang has implied as much. When Nvidia announced a new Blackwell chip earlier this year, he joked that the value of its predecessor, the Hopper, would deteriorate.
                  - paragraph [ref=e241]: “When Blackwell starts shipping in volume, you couldn’t give Hoppers away,” Huang said in March at Nvidia’s AI conference.
                  - paragraph [ref=e242]: “There are circumstances where Hopper is fine,” he continued. “Not many.”
                  - paragraph [ref=e243]:
                    - text: Nvidia now releases new AI chips on an annual basis, versus the two-year cadence it had before.
                    - generic [ref=e244]:
                      - link "Advanced Micro Devices" [ref=e245] [cursor=pointer]:
                        - /url: /quotes/AMD/
                      - button "Add To Watchlist" [ref=e248] [cursor=pointer]
                    - text: ", its closest GPU competitor, followed suit."
                  - paragraph [ref=e250]: Nvidia reports quarterly results next week.
                  - paragraph [ref=e251]:
                    - text: Amazon, in
                    - link "a February filing" [ref=e252] [cursor=pointer]:
                      - /url: https://www.sec.gov/ix?doc=/Archives/edgar/data/1018724/000101872425000004/amzn-20241231.htm
                    - text: ", said it decreased the useful life for a subset of its servers from six years to five years because it conducted a study that found “an increased pace of technology development, particularly in the area of artificial intelligence and machine learning.”"
                  - paragraph [ref=e253]: Meanwhile, other hyperscalers are extending their GPU useful life estimates for newer server equipment.
                - generic [ref=e257]:
                  - generic [ref=e258]: Microsoft Chairman and Chief Executive Officer Satya Nadella speaks during the Microsoft Build 2025, conference in Seattle, Washington, on May 19, 2025.
                  - generic [ref=e259]: Jason Redmond | AFP | Getty Images
                - generic [ref=e260]:
                  - paragraph [ref=e261]:
                    - text: Although Microsoft plans to build AI infrastructure aggressively, CEO Satya Nadella
                    - link "said" [ref=e262] [cursor=pointer]:
                      - /url: https://www.youtube.com/watch?v=8-boBsWcr5A
                    - text: this week that his company is trying to space out its AI chip purchases and not overinvest in a single generation of processors. He added that the biggest competitor for any new Nvidia AI chip is its predecessor.
                  - paragraph [ref=e263]: “One of the biggest learnings we had even with Nvidia is that their pace increased in terms of their migrations,” Nadella said. “That was a big factor. I didn’t want to go get stuck with four or five years of depreciation on one generation.”
                  - paragraph [ref=e264]: Nvidia declined to comment.
                  - paragraph [ref=e265]: Dustin Madsen, vice president of the Society of Depreciation Professionals and founder of Emrydia Consulting, said depreciation is a financial estimate by management and that developments in a fast-moving industry like technology can change initial predictions.
                  - paragraph [ref=e266]: Depreciation estimates, Madsen said, generally take into account assumptions such as technological obsolescence, maintenance, historical lifespans of similar equipment and internal engineering analysis.
                  - paragraph [ref=e267]: “You’re going to have to convince an auditor that what you’re suggesting what its life will be is actually its life,” Madsen said. “They will look at all of those factors, like your engineering data that suggests that the life of these assets is approximately six years, and they will audit that at a very detailed level.”
                  - paragraph [ref=e268]:
                    - emphasis [ref=e269]: "-- CNBC’s Jordan Novet contributed to this story."
