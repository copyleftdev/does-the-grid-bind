            - 'heading "The question everyone in AI is asking: How long before a GPU depreciates?" [level=1] [ref=e107]'
            - generic [ref=e108]:
              - time [ref=e109]:
                - text: Published Fri, Nov 14 2025
                - generic [ref=e110]: •
                - text: 7:00 AM EST
              - generic [ref=e111]: "|"
