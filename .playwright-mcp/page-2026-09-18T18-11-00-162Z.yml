                - generic:
                  - img [ref=e59]
                  - paragraph [ref=e60]: Energy Technologies Area (ETA) researchers are continually building on the strong scientific foundation we have developed over the past 50 years. We address the world’s most pressing scientific challenges across the buildings, transportation, and industrial sectors. ETA is at the forefront of improving the country's aging electrical grid and innovating distributed energy and storage solutions; developing grid-integrated building systems; and providing the most comprehensive market and data analysis worldwide.
