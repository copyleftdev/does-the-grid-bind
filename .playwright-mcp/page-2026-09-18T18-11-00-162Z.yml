              - generic:
                - generic:
                  - img [ref=e98]
                  - paragraph [ref=e99]: The Energy Technologies Area (ETA) is unique in translating fundamental scientific discoveries into scalable technology adoption. Our approach combines an understanding of the marketplace and the role of state and federal regulation and policies. ETA's research drives real-world, practical results that affect and improve the everyday lives of Americans and those across the globe. Saving energy and increasing reliability are key to the foundation of our research, which is driven by techno-economic analysis and in-lab experimentation and discovery.
