          - text: About CBRE Group, Inc.
          - text: "CBRE Group, Inc. (NYSE: CBRE), a Fortune 500 and S&P 500 company headquartered in Dallas, is the world’s largest commercial real estate services and investment firm and a premier provider of critical infrastructure services. The company has more than 155,000 employees serving clients in more than 100 countries. CBRE serves clients through four business segments: Advisory (leasing, sales, debt origination, mortgage servicing, valuations); Building Operations & Experience (facilities management, property management, flex space & experience, critical infrastructure); Project Management (program management, project management, cost consulting); Real Estate Investments (investment management, development). Please visit our website at"
