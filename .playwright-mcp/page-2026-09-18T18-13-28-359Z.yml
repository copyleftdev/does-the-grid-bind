            - paragraph [ref=e159]: “The next phase of growth will be defined less by demand and more by where new supply can realistically come online,” said Gordon Dolven, Director of Data Center Research for CBRE. “With more than 80% of space under construction already spoken for, many occupiers are effectively competing for future inventory rather than existing availability. That dynamic should continue to support rent growth and drive expansion into markets that can offer both power and development certainty.”
            - paragraph [ref=e160]: CBRE expects market conditions to remain tight as power constraints, infrastructure bottlenecks and strong AI-driven demand limit the pace at which new capacity can reach the market.
            - generic [ref=e161]: "*The eight primary North American data center markets are Northern Virginia, Dallas-Fort Worth, Silicon Valley, Chicago, Phoenix, New York Tri-State, Atlanta and Hillsboro."
