                      - strong [ref=e110]: Georgia Power’s 2025 IRP projects nearly 9,885 MW of new generation to support large loads, including data centers, with near-term delivery constrained by substation headroom and full buildout expected 2028–2031.
                    - heading "Overview of the 2025 IRP" [level=2] [ref=e111]
                    - paragraph [ref=e112]:
                      - text: The Georgia Public Service Commission (PSC) approved Georgia Power’s 2025 Integrated Resource Plan (IRP) on July 15, 2025, outlining strategies to meet extraordinary projected load growth in the state, particularly from data centers and other large commercial and industrial customers
