                        - generic [ref=e117]: "+1"
                      - text: . The IRP anticipates approximately
                      - strong [ref=e118]: 8,500 MW of electrical load growth over the next six years
                      - text: ", with a significant portion driven by hyperscale data center expansion"
                      - 'link "Sources: Georgia Power +1" [ref=e119] [cursor=pointer]':
