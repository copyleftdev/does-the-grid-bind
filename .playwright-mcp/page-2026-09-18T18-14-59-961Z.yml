            - row [ref=e80]:
              - rowheader "Abstract" [ref=e81]
              - cell [ref=e82]:
                - paragraph [ref=e85]: "This report updates the 2024 Data Center Energy Usage Report (2024 Report) and estimates that data centers could account for 11.8% of total U.S. electricity by 2030. The estimate also includes a range of scenarios that indicate the energy use could be between 9.5 and 15.3% of total U.S. electricity use by 2030. In comparison, the 2024 Report estimate range was 6.7% to 12.0% of total U.S. electricity by 2028. The resulting electricity usage estimates in this Report are derived from a “bottom-up” energy use model, which determines electricity use from real-world data for planned data center IT equipment shipments (purchases), models of per-device annual electricity use and cooling system performance simulations, along with information on data center facility types and locations. The Reference Case estimate for electricity use (649 TWh in 2030) is calculated based on the current understanding of expected shipments and equipment design across the data center industry. The estimated range for electricity use by 2030 is derived from our Sensitivity Scenarios that explore targeted adjustments from the Reference Case. These Sensitivity Scenarios are driven by alternative data sources or industry feedback suggesting parameters or input datasets that may differ from the Reference Case. The parameters and adjustments include: • Lowering the forecasted installations of data center IT equipment (578 TWh in 2030); • Increasing the forecasted number of specialized graphics chips shipped and installed (664 TWh in 2030); • Reducing the assumed average operating lifetime of Artificial Intelligence (AI) chips (590 TWh in 2030); and • Increasing the idle power and utilization rates of AI servers (782 TWh in 2030). Additionally, the above sensitivities and additional uncertainty are combined into high and low Compounded Uncertainty scenarios, producing the ultimate estimate bounds of 521-843 TWh of U.S. data center electricity consumption in 2030."
