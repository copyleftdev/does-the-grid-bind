              - generic [ref=e100]:
                - 'heading "Queued Up: Characteristics of Power Plants Seeking Transmission Interconnection" [level=1] [ref=e104]'
                - generic [ref=e107]:
                  - paragraph
                  - figure "Active capacity in interconnection queues by generator type, 2014-2025." [ref=e108]:
                    - 'img "Figure: Total Capacity in Queues" [ref=e109]'
                    - emphasis [ref=e111]: Active capacity in interconnection queues by generator type, 2014-2025.
                  - paragraph [ref=e112]: Electric transmission system operators (ISOs, RTOs, or utilities) require proposed power plants seeking to connect to the transmission grid to undergo a series of impact studies before they can be built. This process establishes what new transmission equipment or upgrades may be needed before a project can connect to the system and assigns the costs of that equipment. The lists of projects in this process are known as “interconnection queues”.
                  - paragraph [ref=e113]: As of the end of 2025, over 2,060 gigawatts (GW) of total generation and storage capacity were actively seeking connection to the grid. However, most projects that apply for interconnection are ultimately withdrawn, and those that are built are taking longer on average to complete the required studies and become operational. Data from these queues nonetheless provide a general indicator for future electric capacity additions.
                  - paragraph [ref=e114]: The attachments below include an Excel data file and a PDF data visualization slide-deck. The Excel data file was last updated in May, 2026, and features interconnection data through the end of 2025. The PDF report was published in June 2026, and analyzes interconnection data and metrics through the end of 2025.
                  - paragraph [ref=e115]:
                    - text: Interconnection queue data were compiled, cleaned, and aggregated in partnership with
                    - link "GridTracker (link is external)" [ref=e116] [cursor=pointer]:
                      - /url: https://www.gridtracker.io/
                      - text: GridTracker
                      - img "(link is external)" [ref=e117]
                    - text: . The Excel data file includes interconnection data from all seven ISOs/RTOs alongside 50 non-ISO utilities, which collectively represent ~98% of the currently installed U.S. electric generating capacity.
                  - paragraph [ref=e120]: "Key highlights from the Queued Up: 2026 Edition (featuring data through 2025) include:"
                  - list [ref=e121]:
                    - listitem [ref=e122]: As of the end of 2025, there were ~8,200 projects actively seeking grid interconnection in the U.S., representing 1,312 GW of generation and approximately 749 GW of storage.
                    - listitem [ref=e123]: High withdrawal rates alongside relatively fewer new requests resulted in a 10% decrease in total active queue volume compared to the prior year.
                    - listitem [ref=e124]: Active natural gas capacity (253 GW, +86%) increased in 2025, while solar (773 GW, -19%), storage (749 GW, -16%) and wind (220 GW, -19%) capacity decreased.
                    - listitem [ref=e125]: 549 GW of capacity already has a draft or executed interconnection agreement (IA) but has not yet reached commercial operations, including 256 GW of solar, 161 GW of storage, 76 GW of wind, and 45 GW of gas.
                    - listitem [ref=e126]: The time projects spend in queues before reaching COD is increasing. For the regions with available data, the median duration from IR to COD was over 5 years for projects built in 2025.
                    - listitem [ref=e127]: Ultimately, most of this proposed capacity will not be built. Only 13% of capacity that submitted interconnection requests from 2000-2020 had reached commercial operations by the end of 2025; 75% of that capacity had been withdrawn and 10% was still active.
                    - listitem [ref=e128]: FERC Order 2023 and various other reforms are being implemented. These are important measures to reduce interconnection bottlenecks and enhance grid system reliability, but it is too early to measure and assess their full impact.
                  - paragraph [ref=e129]:
                    - text: For further details on these and other findings, please refer to the PDF slide-deck and Excel data file, which can be downloaded at the links below under “Attachment”, or via the related webpage
                    - link "here" [ref=e130] [cursor=pointer]:
                      - /url: /publications/queued-2026-edition-characteristics
                    - text: . The briefing is also accompanied by an interactive data visualization
                    - link "here" [ref=e131] [cursor=pointer]:
                      - /url: /generation-storage-and-hybrid-capacity
                    - text: and interactive maps
                    - link "here" [ref=e132] [cursor=pointer]:
                      - /url: /maps-projects-region-state-and-county
                    - text: .
                  - paragraph [ref=e133]:
                    - text: A webinar highlighting the findings from the latest edition of Queued Up recorded on July 16, 2026, can be viewed
                    - link "here" [ref=e134] [cursor=pointer]:
                      - /url: /queued-2026-edition-characteristics-power-plants-seeking-transmission-interconnection-end-2025
                    - text: .
