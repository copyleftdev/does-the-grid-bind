        - 'link "Every hyperscaler''s earnings report now contains a number almost nobody outside an accounting department reads closely: the assumed useful life of its servers. It sits in a footnote, expressed in years, and it quietly decides how much profit the company reports each quarter." [ref=e25] [cursor=pointer]':
