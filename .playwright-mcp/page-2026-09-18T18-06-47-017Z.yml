        - link "The hyperscaler depreciation debate has been conducted largely as an argument about earnings management, but, in our view, that is too narrow. Investors should certainly scrutinise useful-life assumptions, but they should also consider whether the accounting methodology itself produces a useful representation of asset consumption and replacement." [ref=e45] [cursor=pointer]:
