        - link "When a company buys a GPU, it spreads the cost over an estimated useful life, so a longer schedule reduces the annual expense and lifts reported profit. By Burry's estimate, the five hyperscalers could have understated depreciation by around $176 billion from 2026 to 2028 if AI chips really follow a 2-3 year cycle." [ref=e45] [cursor=pointer]:
          - /url: //duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.ainvest.com%2Fnews%2Fburry%2D2%2D3%2Dyear%2Dai%2Dchip%2Dwarning%2Dhits%2Dhyperscaler%2Dspending%2Djumped%2D725%2Dbillion%2D2607%2F&rut=de74cffacbb0bf7ef66abf10f0716e265c4e5f831719552dbc8b92f4b1276a37
