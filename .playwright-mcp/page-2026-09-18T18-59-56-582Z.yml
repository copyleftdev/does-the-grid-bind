      - paragraph [ref=e27]: The thesis is simple enough. Semiconductor output can double in a year. Substations cannot. So hardware arrives before power does, and the excess must either sit in a warehouse losing value or displace working machines that have not finished depreciating. Both cost money. Watch the substation queues, not just the wafer starts.
