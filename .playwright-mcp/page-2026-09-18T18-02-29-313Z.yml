        - generic [ref=e123]:
          - paragraph [ref=e125]: Barclays has lowered its expectations for Alphabet, Amazon, and Meta due to the increase in depreciation expenses caused by artificial intelligence-related costs.
          - paragraph [ref=e126]: According to the Futu Securities News app, Barclays has lowered its expectations for Alphabet (GOOGL.US), Amazon (AMZN.US) and Meta (META.US) due to the increase in depreciation expenses caused by artificial intelligence-related costs. Specifically, the bank has given Alphabet, Amazon, and Meta a "shareholding" rating, with target prices of $200, $220 (down from $230) and $520, respectively.
          - paragraph [ref=e127]: Barclays analyst Ross Sandler pointed out that the market has made a wrong estimate of the not-so-hidden costs of artificial intelligence, which account for 5%-10% of earnings per share and the P/E ratio. Fortunately, the market may have taken into account enough capital expenditures to explain the upcoming AI frenzy.
          - paragraph [ref=e128]:
            - text: Analysts said they are comprehensively lowering their valuations of US internet giants, as their depreciation expenses will increase and employee numbers will return to normal levels in 2025 and 2026. In their view, buyers have already understood these depreciation and amortization trends, but they have not yet been factored into consensus estimates. The depreciation of AI computing
            - link "assets" [ref=e129] [cursor=pointer]:
              - /url: https://www.moomoo.com/learn/detail-what-is-a-balance-sheet-102280-230346194
            - text: is the biggest expense for these internet giants (although it is non-cash), and other costs such as electrical utilities, cooling, and personnel also represent increased expenses.
          - paragraph [ref=e130]: Analysts are generally bullish on artificial intelligence and large-cap stocks entering the second quarter earnings season, but they believe that this risk may surface as they begin to look ahead to 2025, so they are issuing warnings in advance. Analysts and their teams point out that it appears that the market (consensus) is using the most basic revenue percentage to predict depreciation, which may be effective before the AI frenzy, but they believe it is not correct in the future.
          - paragraph [ref=e131]: Analysts believe that the explosive growth in AI computing capital expenditures is changing this equation, so depreciation is likely to become a significant disadvantage for future profitability. For the past few years, the useful life of servers has been extended for accounting purposes, partially offsetting the impact of depreciation and amortization expenses, but once Meta's servers reach their 6-year lifespan (possibly in 2025), this benefit will no longer exist, and large-cap investors will have to begin calculating depreciation and amortization costs correctly.
